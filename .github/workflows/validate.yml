name: Go validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-validation-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.8', '1.27.1']
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOAMD64: v1
      GOARM64: v8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: false
          cache: false
      - name: Assert exact toolchain and language floor
        env:
          EXPECTED_GO_VERSION: ${{ matrix.go }}
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          test "$(go env GOVERSION)" = "go${EXPECTED_GO_VERSION}"
          test "$(awk '$1 == "go" { print $2 }' go.mod)" = '1.26.0'
      - name: Install verified ShellCheck 0.11.0
        run: |
          tool_dir=$(mktemp -d)
          archive="$tool_dir/shellcheck.tar.xz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$archive"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$tool_dir"
          "$tool_dir/shellcheck-v0.11.0/shellcheck" --version
          echo "$tool_dir/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          echo "SHELLCHECK_EXPECTED_PATH=$tool_dir/shellcheck-v0.11.0/shellcheck" >> "$GITHUB_ENV"
      - name: Verify modules and tidy cleanliness
        run: |
          scripts/with-build-lock sh -eu -c '
            go mod download
            go mod verify
            go mod tidy
            git diff --exit-code -- go.mod go.sum
          '
      - name: Formatting, shell analysis, vet and offline tests
        env:
          GOPROXY: 'off'
          GOFLAGS: '-mod=readonly'
        run: |
          test "$(command -v shellcheck)" = "$SHELLCHECK_EXPECTED_PATH"
          shellcheck --version | grep -Fx 'version: 0.11.0'
          scripts/check
      - name: Reachable vulnerability scan including tests
        env:
          GOFLAGS: '-mod=readonly'
        run: |
          scripts/with-build-lock go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 \
            -format text -scan symbol -test -show verbose,version \
            -db https://vuln.go.dev ./...
      - name: Race tests on Linux amd64
        if: matrix.go == '1.27.1'
        env:
          CGO_ENABLED: '1' # Validation only; release builds stay pure Go.
          GOPROXY: 'off'
          GOFLAGS: '-mod=readonly'
        run: scripts/with-build-lock go test -race -count=1 ./...
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.go == '1.27.1'
        with:
          node-version: '24.21.0'
          check-latest: false
      - name: Native JavaScript execution-text conformance
        if: matrix.go == '1.27.1'
        run: |
          test "$(node --version)" = 'v24.21.0'
          node scripts/check-text-conformance.mjs
      - name: Pure-Go cross-builds for all planned release targets
        if: matrix.go == '1.27.1'
        env:
          GOPROXY: 'off'
          GOFLAGS: '-mod=readonly'
        run: scripts/cross-build
      - name: Injected version reaches the built command
        if: matrix.go == '1.27.1'
        env:
          GOPROXY: 'off'
          GOFLAGS: '-mod=readonly'
        run: |
          ANTAEUS_VERSION=v0.0.0-ci ANTAEUS_COMMIT=ci123 scripts/build
          test "$(.tmp/bin/antaeus version)" = 'antaeus v0.0.0-ci (ci123)'
